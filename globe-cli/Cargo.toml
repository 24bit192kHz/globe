[package]
name = "globe-cli"
version = "0.3.0"
authors = ["adamsky <adamsky@enum.space>"]
edition = "2018"
rust-version = "1.70"
repository = "https://github.com/adamsky/globe"
homepage = "https://github.com/adamsky/globe"
documentation = "https://docs.rs/globe-cli"
description = "Display an interactive ASCII globe in your terminal."
categories = ["command-line-utilities", "visualization"]
keywords = ["ascii", "globe", "terminal", "cli", "tui"]
readme = "README.md"
license = "GPL-3.0"

[[bin]]
name = "globe"
path = "src/main.rs"

[dependencies]
globe = { version = "0.3.0", path = "../globe" }
crossterm = "0.18.2"
clap = { version = "3.0.0", default-features = false, features = ["std"] }

[lints]
workspace = true
